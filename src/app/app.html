<main class="app-shell">
    <section class="form-panel" aria-labelledby="page-title">
        <header class="page-header">
            <p class="eyebrow">Resume builder</p>
            <h1 id="page-title">Basic information</h1>
            <p class="intro">Start with the details employers should see first.</p>
        </header>
        <form class="basic-information-form" [formGroup]="firstFormGroup">
            <div class="col-span-full">
                <label class="form-label" for="fullName">Full name</label>
                <input id="fullName" class="form-control" placeholder="Jane Doe" formControlName="fullName" required>
            </div>
            <div class="col-span-full">
                <label class="form-label" for="jobTitle">Job title / target role</label>
                <input id="jobTitle" class="form-control" placeholder="Software Engineer" formControlName="jobTitle" required>
            </div>
            <div>
                <label class="form-label" for="email">Email</label>
                <input id="email" class="form-control" type="email" placeholder="jane@example.com" formControlName="email" required>
            </div>
            <div>
                <label class="form-label" for="phone">Phone</label>
                <input id="phone" class="form-control" type="tel" placeholder="Optional" formControlName="phone">
            </div>
            <div>
                <label class="form-label" for="location">Location</label>
                <input id="location" class="form-control" placeholder="New York, NY" formControlName="location" required>
            </div>
            <div>
                <label class="form-label" for="linkedIn">LinkedIn</label>
                <input id="linkedIn" class="form-control" type="url" placeholder="https://linkedin.com/in/janedoe" formControlName="linkedIn">
            </div>
            <div>
                <label class="form-label" for="gitHub">GitHub</label>
                <input id="gitHub" class="form-control" type="url" placeholder="https://github.com/janedoe" formControlName="gitHub">
            </div>
            <div class="col-span-full">
                <label class="form-label" for="portfolio">Portfolio / website</label>
                <input id="portfolio" class="form-control" type="url" placeholder="https://janedoe.dev" formControlName="portfolio">
            </div>
            <div class="col-span-full">
                <label class="form-label" for="profilePhoto">Profile photo <span class="text-body-secondary">(optional)</span></label>
                <input id="profilePhoto" class="form-control" type="file" accept="image/*">
            </div>
            <div class="col-span-full form-actions">
                <button class="btn btn-primary" type="submit">Save basic information</button>
            </div>
        </form>
    </section>
</main>
<router-outlet />
